[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "devpy-runner"
version = "0.1.2"
description = "Editable Python installs in git worktrees without copying heavy dependencies."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ali K" },
]
keywords = ["python", "conda", "venv", "editable", "worktree"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.11",
]

[project.scripts]
devpy = "devpy_runner.cli:main"

[project.urls]
Homepage = "https://github.com/alik-git/devpy-runner"
Repository = "https://github.com/alik-git/devpy-runner"
Issues = "https://github.com/alik-git/devpy-runner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/devpy_runner"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
  "E",
  "W",
  "I",
  "UP",
  "B",
  "BLE",
  "PLE",
  "PLW",
  "S",
  "A",
  "ARG",
  "C4",
  "DTZ",
  "FBT003",
  "NPY",
  "PERF",
  "PTH",
  "RET",
  "SIM",
  "G",
  "LOG",
  "TC",
  "ANN201",
  "ANN202",
  "ANN204",
  "D100",
  "D104",
  "D102",
  "D103",
  "D2",
  "D4",
  "PT",
  "RUF100",
  "RUF102",
  "RUF104",
  "PLR0402",
  "PLR1722",
  "TRY203",
]

ignore = [
  "TC006",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["devpy_runner"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["src/devpy_runner"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = false
follow_imports = "silent"
disable_error_code = ["import-untyped"]
show_error_codes = true
pretty = true
